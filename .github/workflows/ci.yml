name: Selenium Cucumber Tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tags: @smoke, @regression and @positive, etc."
        required: true
        default: "@smoke"
        type: string
      browser:
        description: "Browser"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - chrome
          - firefox
      headless:
        description: "Run browser in headless mode"
        required: true
        default: true
        type: boolean


jobs:
  # =========================================================
  # BUILD BROWSER MATRIX
  # =========================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.matrix.outputs.browsers }}
    steps:
      - name: Build browser matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ inputs.browser }}" = "both" ]; then
            echo 'browsers=["chrome","firefox"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.browser }}" = "chrome" ]; then
            echo 'browsers=["chrome"]' >> "$GITHUB_OUTPUT"
          else
            echo 'browsers=["firefox"]' >> "$GITHUB_OUTPUT"
          fi
  # =========================================================
  # SELENIUM TESTS
  # =========================================================
  selenium-tests:
    needs: prepare
    name: ${{ matrix.browser }} | ${{ inputs.tags }}
    runs-on: ubuntu-latest
    strategy:
      # Firefox failing should not cancel Chrome
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.prepare.outputs.browsers) }}


    steps:
      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
      # -------------------------------------------------------
      # JAVA
      # -------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      # -------------------------------------------------------
      # ENVIRONMENT
      # -------------------------------------------------------
      - name: Display environment
        run: |
          echo "========================================"
          echo "ENVIRONMENT"
          echo "========================================"
          java -version
          mvn -version
          echo "========================================"

      # -------------------------------------------------------
      # BROWSER VERSIONS
      # -------------------------------------------------------
      - name: Display browser versions
        run: |
          echo "========================================"
          echo "BROWSER VERSIONS"
          echo "========================================"
          google-chrome --version || true
          firefox --version || true
          echo "========================================"

      # -------------------------------------------------------
      # TEST CONFIGURATION
      # -------------------------------------------------------

      - name: Display test configuration
        run: |
          echo "========================================"
          echo "TEST EXECUTION"
          echo "========================================"
          echo "Browser  : ${{ matrix.browser }}"
          echo "Headless : ${{ inputs.headless }}"
          echo "Tags     : ${{ inputs.tags }}"
          echo "========================================"
      # -------------------------------------------------------
      # RUN TESTS
      # -------------------------------------------------------
      - name: Run Cucumber tests
        run: |
          mvn -B -ntp clean test \
            -Dbrowser=${{ matrix.browser }} \
            -Dheadless=${{ inputs.headless }} \
            -Dcucumber.filter.tags="${{ inputs.tags }}"

      # -------------------------------------------------------
      # REPORT
      # -------------------------------------------------------
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/surefire-reports/
          if-no-files-found: ignore